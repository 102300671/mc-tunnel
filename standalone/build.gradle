// 独立 jar 入口:纯 Java + application 插件,打 fat jar
plugins {
    id 'application'
}

// 锁定 Java 17
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

base {
    archivesName = 'mctunnel-standalone'
}

application {
    mainClass = 'io.mctunnel.standalone.Main'
}

dependencies {
    // 依赖 core 模块
    implementation project(':core')
}

// 打 fat jar:把所有 runtime classpath 进 jar,可 java -jar 直接跑
jar {
    manifest {
        attributes 'Main-Class': 'io.mctunnel.standalone.Main'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
