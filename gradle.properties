# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

## 环境属性 (Environment Properties)

# Minecraft 版本必须与 Forge 版本匹配
minecraft_version=1.20.1
# Minecraft 版本范围
minecraft_version_range=[1.20.1,1.21)
# Forge 版本必须与 Minecraft 版本匹配
forge_version=47.3.0
# Forge 版本范围
forge_version_range=[47,)
# 加载器版本范围(只用 Forge 主版本号)
loader_version_range=[47,)
# 映射 channel: official / parchment
mapping_channel=official
# 映射版本(随 channel 格式而定)
mapping_version=1.20.1


## 模组属性 (Mod Properties)

# 模组 ID:小写字母数字下划线,匹配 [a-z][a-z0-9_]{1,63}
mod_id=mctunnel
# 人类可读名称
mod_name=MC Tunnel
# 许可证
mod_license=MIT
# 模组版本(语义化版本)
mod_version=1.0.0-SNAPSHOT
# 组 ID(发布到 Maven 时用)
mod_group_id=io.mctunnel
# 作者
mod_authors=MC-Tunnel Team
# 描述(多行可用 \n)
mod_description=Mod for managing tunneling and virtual networking tools (ngrok, Tailscale), archive sync (SyncThing), and cross-session chat.

# 多平台适配:不写死 org.gradle.java.home(不同机器 JDK 路径不同,如 arm64/amd64)。
# 编译 JDK 由各子项目的 java.toolchain(17) 自动探测本地安装(扫描 /usr/lib/jvm 等);
# 禁止工具链自动下载,只认本机 JDK。个别机器如需固定守护进程 JVM,在
# ~/.gradle/gradle.properties 里自行设置 org.gradle.java.home(用户级,不入库)。
org.gradle.java.installations.auto-download=false
